# =======================================================
# Catppuccin Mocha palette — single source of truth for the whole
# desktop. Canonical key names mirror ohmydebn's "semantic" theme format
# (https://github.com/dougburks/ohmydebn, MIT licensed): named colors plus
# background/foreground shades. lib/theme-apply.sh derives the legacy
# ANSI color0-15 + cursor + selection aliases from these and renders every
# app config (gnome-terminal, btop, bat, eza, starship, fastfetch) from them.
#
# The values below are the upstream Catppuccin Mocha palette. This toolkit
# uses the Red accent variant so the app layer (starship/btop/bat/menu/
# update GUI) matches the Catppuccin Mocha-Red chrome applied by step 04.
#   accent  -> Red    #f38ba8
#   red     -> Red    #f38ba8
#   green   -> Green  #a6e3a1
#   yellow  -> Yellow #f9e2af
#   blue    -> Blue   #89b4fa
#   magenta -> Pink   #f5c2e7
#   cyan    -> Teal   #94e2d5
# =======================================================
mode = "dark"

accent = "#f38ba8"
selection = "#45475a"
muted = "#585b70"

background = "#1e1e2e"
dark_background = "#161622"
darker_background = "#101019"
lighter_background = "#313244"

foreground = "#cdd6f4"
dark_foreground = "#6c7086"
light_foreground = "#bac2de"
bright_foreground = "#cdd6f4"

red = "#f38ba8"
yellow = "#f9e2af"
orange = "#f6b6ab"
green = "#a6e3a1"
cyan = "#94e2d5"
blue = "#89b4fa"
magenta = "#f5c2e7"
brown = "#7b5b55"

bright_red = "#f38ba8"
bright_yellow = "#f9e2af"
bright_green = "#a6e3a1"
bright_cyan = "#94e2d5"
bright_blue = "#89b4fa"
bright_magenta = "#f5c2e7"