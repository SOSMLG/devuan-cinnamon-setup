# Graphite Amber for eza - static theme for the Graphite + Amber standard.
# Installed by devuan-cinnamon-setup. Not templated from the palette because
# the canonical values are baked in here.
colourful: true

filekinds:
  normal: {foreground: "#D8D3C8"}
  directory: {foreground: "#7E9DB5"}
  symlink: {foreground: "#79A9A6"}
  pipe: {foreground: "#9A9AA2"}
  block_device: {foreground: "#C97064"}
  char_device: {foreground: "#C97064"}
  socket: {foreground: "#30343B"}
  special: {foreground: "#A78BB5"}
  executable: {foreground: "#8FB57A"}
  mount_point: {foreground: "#7E9DB5"}

perms:
  user_read: {foreground: "#D8D3C8"}
  user_write: {foreground: "#E8A33D"}
  user_execute_file: {foreground: "#8FB57A"}
  user_execute_other: {foreground: "#8FB57A"}
  group_read: {foreground: "#D8D3C8"}
  group_write: {foreground: "#E8A33D"}
  group_execute: {foreground: "#8FB57A"}
  other_read: {foreground: "#9A9AA2"}
  other_write: {foreground: "#E8A33D"}
  other_execute: {foreground: "#8FB57A"}
  special_user_file: {foreground: "#A78BB5"}
  special_other: {foreground: "#30343B"}
  attribute: {foreground: "#9A9AA2"}

size:
  major: {foreground: "#9A9AA2"}
  minor: {foreground: "#79A9A6"}
  number_byte: {foreground: "#D8D3C8"}
  number_kilo: {foreground: "#D8D3C8"}
  number_mega: {foreground: "#7E9DB5"}
  number_giga: {foreground: "#A78BB5"}
  number_huge: {foreground: "#A78BB5"}
  unit_byte: {foreground: "#9A9AA2"}
  unit_kilo: {foreground: "#7E9DB5"}
  unit_mega: {foreground: "#A78BB5"}
  unit_giga: {foreground: "#A78BB5"}
  unit_huge: {foreground: "#7E9DB5"}

users:
  user_you: {foreground: "#D8D3C8"}
  user_root: {foreground: "#C97064"}
  user_other: {foreground: "#A78BB5"}
  group_yours: {foreground: "#D8D3C8"}
  group_other: {foreground: "#9A9AA2"}
  group_root: {foreground: "#C97064"}

links:
  normal: {foreground: "#79A9A6"}
  multi_link_file: {foreground: "#7E9DB5"}

git:
  new: {foreground: "#8FB57A"}
  modified: {foreground: "#E8A33D"}
  deleted: {foreground: "#C97064"}
  renamed: {foreground: "#79A9A6"}
  typechange: {foreground: "#A78BB5"}
  ignored: {foreground: "#9A9AA2"}
  conflicted: {foreground: "#C97064"}

git_repo:
  branch_main: {foreground: "#D8D3C8"}
  branch_other: {foreground: "#A78BB5"}
  git_clean: {foreground: "#8FB57A"}
  git_dirty: {foreground: "#C97064"}

security_context:
  colon: {foreground: "#9A9AA2"}
  user: {foreground: "#D8D3C8"}
  role: {foreground: "#A78BB5"}
  typ: {foreground: "#30343B"}
  range: {foreground: "#A78BB5"}

file_type:
  image: {foreground: "#E8A33D"}
  video: {foreground: "#C97064"}
  music: {foreground: "#8FB57A"}
  lossless: {foreground: "#79A9A6"}
  crypto: {foreground: "#30343B"}
  document: {foreground: "#D8D3C8"}
  compressed: {foreground: "#A78BB5"}
  temp: {foreground: "#C97064"}
  compiled: {foreground: "#7E9DB5"}
  build: {foreground: "#30343B"}
  source: {foreground: "#7E9DB5"}

punctuation: {foreground: "#9A9AA2"}
date: {foreground: "#E8A33D"}
inode: {foreground: "#9A9AA2"}
blocks: {foreground: "#9A9AA2"}
header: {foreground: "#D8D3C8"}
octal: {foreground: "#79A9A6"}
flags: {foreground: "#A78BB5"}

symlink_path: {foreground: "#79A9A6"}
control_char: {foreground: "#7E9DB5"}
broken_symlink: {foreground: "#C97064"}
broken_path_overlay: {foreground: "#30343B"}